services:
  # ===========================================================================
  # SQL Server — base de datos
  # ===========================================================================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskflow-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Unicesar+2026"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - taskflow
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Unicesar+2026' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # TaskFlow API (.NET 9)
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: julianariasdev/taskflow-api:latest
    container_name: taskflow-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=TaskFlowDB;User=sa;Password=Unicesar+2026;TrustServerCertificate=True;"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taskflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ===========================================================================
  # TaskFlow Frontend (React + Vite servido por Nginx)
  # ===========================================================================
  web:
    build:
      context: ./TaskFlow_front
      dockerfile: Dockerfile
      args:
        # Vacío => el cliente usa /api (relativo) y nginx proxea al backend.
        VITE_API_URL: ""
    image: julianariasdev/taskflow-frontend:latest
    container_name: taskflow-web
    # Puerto del host configurable vía variable FRONTEND_PORT (default 8081).
    # Si necesitas otro puerto: $env:FRONTEND_PORT=5173; docker compose up -d
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - taskflow
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  sqlserver_data:
    driver: local

networks:
  taskflow:
    driver: bridge
