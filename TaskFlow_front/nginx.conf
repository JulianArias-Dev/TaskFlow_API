# =============================================================================
# nginx config para TaskFlow Frontend
# - Sirve el bundle estático generado por Vite.
# - Hace proxy de /api → servicio del backend (taskflow-api:8080 en compose).
# - Soporta rutas client-side de React Router (try_files con fallback a index).
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión básica
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/xml image/svg+xml;

    # ---------- API proxy -------------------------------------------------
    # El host "taskflow-api" se resuelve dentro de la red de docker-compose.
    # Para entornos distintos, sobreescribe la variable de entorno BACKEND_HOST
    # a nivel de contenedor o cambia este `proxy_pass`.
    location /api/ {
        proxy_pass         http://taskflow-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Permite ver el header de token expirado que emite el backend.
        proxy_pass_header  X-Token-Expired;
    }

    # ---------- Health check ---------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------- Cache para assets versionados ----------------------------
    location ~* \.(?:js|css|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ---------- SPA fallback ---------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Páginas de error sencillas (sin filtrar info).
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
